name: Bug report
description: Something in Swipify doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick playlist …
        2. Swipe left on …
        3. …
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Any message shown in Swipify, or errors from the browser console (F12 → Console).
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 140
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15
    validations:
      required: true
  - type: dropdown
    id: premium
    attributes:
      label: Do you have Spotify Premium?
      description: Playback in the browser only works with Premium.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
